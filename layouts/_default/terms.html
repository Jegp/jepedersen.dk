{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>

<ul class="tag-list">
  {{ range .Data.Terms.ByCount }}
    <li><a class="tag" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span style="color:var(--fg-faint)">{{ .Count }}</span></a></li>
  {{ end }}
</ul>
{{ end }}
