<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p style="margin:0">&copy; {{ now.Year }} {{ site.Params.author | default site.Title }}</p>

    {{ with site.Params.ananke_socials }}
      <div class="socials">
        {{ range . }}
          <a href="{{ .url }}" title="{{ .label | default .name }}"
             {{ with .rel }}rel="{{ . }}"{{ end }}>
            {{ with resources.Get (printf "svg/%s.svg" .name) }}
              {{ .Content | safeHTML }}
            {{ else }}
              <span>{{ $.Scratch.Set "n" "" }}{{ .name }}</span>
            {{ end }}
          </a>
        {{ end }}
      </div>
    {{ end }}
  </div>
</footer>
